[package]
name = "ryhome"
version = "0.1.0"
description = "RyHome desktop client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ryhome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.6", features = ["tray-icon"] }
tauri-plugin-autostart = "~2.5.1"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
getrandom = "0.3.4"
dunce = "1.0.5"
